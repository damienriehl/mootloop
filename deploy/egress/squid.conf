# Authenticated, destination-allowlisted CONNECT proxy for hosted model and
# application-built public legal-source traffic. Application code independently
# restricts legal requests to reviewed methods and paths and privacy-checks payloads.
http_port 3128
pid_filename none
coredump_dir none

auth_param basic program /usr/lib/squid/basic_ncsa_auth /tmp/mootloop-squid-passwords
auth_param basic realm mootloop-egress
acl model_identity proxy_auth mootloop-model
acl legal_identity proxy_auth mootloop-legal
acl model_hosts dstdomain api.anthropic.com
acl legal_hosts dstdomain www.courtlistener.com api.courtlistener.com www.revisor.mn.gov
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow model_identity model_hosts CONNECT SSL_ports
http_access allow legal_identity legal_hosts CONNECT SSL_ports
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
