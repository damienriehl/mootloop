# Authenticated, destination-allowlisted CONNECT proxy for hosted model traffic.
http_port 3128
pid_filename none
coredump_dir none

auth_param basic program /usr/lib/squid/basic_ncsa_auth /tmp/mootloop-squid-passwords
auth_param basic realm mootloop-egress
acl authenticated proxy_auth REQUIRED
acl model_hosts dstdomain api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow authenticated model_hosts CONNECT SSL_ports
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
