schema_version: "1.0"

actor_policies:
  authenticated-read: Authenticated principals may inspect; every matter-scoped API read is audited.
  authenticated-human: A trusted OS or Access principal is derived by the adapter and recorded.
  hard-human: An agent may prepare the action, but only a trusted human principal may authorize it.
  policy-delegable: Automation is allowed only inside a recorded matter policy and bounded cap.

