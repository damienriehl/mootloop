# MootLoop matter tier (plans FE-0/FE-1, FD-5 topology) — Coolify Docker Compose app.
#
# Two core services plus a per-matter worker profile:
#   web    — the Next.js BFF; the ONLY publicly routable service (fqdn set in Coolify,
#            never here). It fronts the API and enforces Cloudflare Access.
#   api    — the write-tier FastAPI over the live vaults; INTERNAL only (no ports).
#   driver — one-matter engine worker; INTERNAL network to its egress proxy only.
#   egress-proxy — authenticated fixed-destination CONNECT proxy; never published.
#
# Hard rules: no service mounts the Docker socket; api/driver are never published;
# driver secrets/signing keys resolve through the read-only ~/.mootloop mount, while
# the proxy receives only its dedicated Compose secret;
# Coolify generates the network + Traefik labels, so this file stays minimal.

services:
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    # Traefik reaches the BFF over the Coolify network — never publish a host port
    # (a published ephemeral port would expose the origin beside Cloudflare).
    expose:
      - "8000"
    environment:
      # Coolify-injected placeholders (values live only in Coolify, never in the repo).
      MOOTLOOP_API_URL: http://api:8000
      MOOTLOOP_INTERNAL_SECRET: ${MOOTLOOP_INTERNAL_SECRET}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      CF_ACCESS_ALLOWED_EMAIL: ${CF_ACCESS_ALLOWED_EMAIL}
    labels:
      # Per-hostname Authenticated Origin Pulls (FD-2): require + verify the Cloudflare
      # client cert on THIS vhost only. The referenced tls option lives in the box's
      # Traefik dynamic config (/data/coolify/proxy/dynamic/mootloop-aop.yaml, caFiles =
      # the AOP CA); Coolify generates the router, we only attach the option. The router
      # name is Coolify-derived from the app UUID + service; re-derive if the app is
      # recreated. Direct-to-origin requests (bypassing Cloudflare) fail the handshake.
      - "traefik.http.routers.https-0-op3exbmxe1q21qyy69tlngk9-web.tls.options=mootloop-aop@file"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.matter-api
    restart: unless-stopped
    # INTERNAL only — no published ports; the BFF reaches it as http://api:8000.
    expose:
      - "8000"
    environment:
      MOOTLOOP_MATTERS_ROOT: /srv/mootloop-matters
      MOOTLOOP_RUNTIME_MODE: hosted
      # Canary registry lives under the writable matters-root, NOT ~/.mootloop
      # (that mount is read-only, so the default path fails closed on matter create).
      MOOTLOOP_CANARY_REGISTRY: /srv/mootloop-matters/.canaries.json
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      CF_ACCESS_ALLOWED_EMAIL: ${CF_ACCESS_ALLOWED_EMAIL}
    volumes:
      # Live vaults (read-write: the write tier persists here).
      - /srv/mootloop-matters:/srv/mootloop-matters
      # Host service-user secrets, read-only: MOOTLOOP_INTERNAL_SECRET + the download
      # signing key resolve through ~/.mootloop/secrets.env (mootloop.secrets).
      - /home/mootloop/.mootloop:/home/mootloop/.mootloop:ro

  driver:
    profiles: ["matter-worker"]
    build:
      context: .
      dockerfile: Dockerfile.driver
    restart: unless-stopped
    # INTERNAL only — no ports at all (no web surface).
    environment:
      MOOTLOOP_WORKER_ID: ${MOOTLOOP_WORKER_ID}
      # `unbound` makes core-only compose parsing safe; the hosted CLI refuses it.
      MOOTLOOP_MATTER_ID: ${MOOTLOOP_MATTER_ID:-unbound}
      MOOTLOOP_RUNTIME_MODE: hosted
      MOOTLOOP_EGRESS_PROXY_URL: http://egress-proxy:3128
      MOOTLOOP_ENGINE_CONFIG_DIR: /var/lib/mootloop-engine-config
      MOOTLOOP_CANARY_REGISTRY: /srv/mootloop-worker/.canaries.json
      MOOTLOOP_FOLIO_ENRICH_URL: http://folio-enrich:8731
      MOOTLOOP_FOLIO_ENRICH_IMAGE: ${MOOTLOOP_FOLIO_ENRICH_IMAGE:?digest-pinned image required}
      MOOTLOOP_FOLIO_ENRICH_COMMIT: ${MOOTLOOP_FOLIO_ENRICH_COMMIT:?reviewed commit required}
    volumes:
      # Control-plane queue metadata is shared; no sibling vault is mounted.
      - /srv/mootloop-matters/.queue:/srv/mootloop-worker/.queue
      - /srv/mootloop-matters/.canaries.json:/srv/mootloop-worker/.canaries.json:ro
      - type: bind
        source: ${MOOTLOOP_MATTER_SOURCE:?validated matter source required}
        target: /srv/mootloop-worker/matter
        bind:
          create_host_path: false
      - type: bind
        source: ${MOOTLOOP_ENGINE_CONFIG_SOURCE:?validated engine config source required}
        target: /var/lib/mootloop-engine-config/${MOOTLOOP_MATTER_ID:?bound matter required}
        bind:
          create_host_path: false
      - /home/mootloop/.mootloop:/home/mootloop/.mootloop:ro
    networks:
      - driver-egress
      - driver-conversion
    depends_on:
      egress-proxy:
        condition: service_healthy
      folio-enrich:
        condition: service_healthy
    # Must outlast an in-flight claude turn (timeout_s=600) so SIGTERM drains cleanly.
    stop_grace_period: 630s

  egress-proxy:
    profiles: ["matter-worker"]
    build:
      context: .
      dockerfile: Dockerfile.driver
    restart: unless-stopped
    command: ["python", "-m", "mootloop.engine.proxy_service"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x squid >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    environment:
      MOOTLOOP_RUNTIME_MODE: hosted
      MOOTLOOP_EGRESS_PROXY_PASSWORD_FILE: /run/secrets/egress_proxy_password
      MOOTLOOP_LEGAL_EGRESS_PROXY_PASSWORD_FILE: /run/secrets/legal_egress_proxy_password
    secrets:
      - egress_proxy_password
      - legal_egress_proxy_password
    networks:
      - driver-egress
      - proxy-outbound

  folio-enrich:
    profiles: ["matter-worker"]
    image: ${MOOTLOOP_FOLIO_ENRICH_IMAGE:?digest-pinned folio-enrich image required}
    restart: unless-stopped
    read_only: true
    user: appuser
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    expose:
      - "8731"
    environment:
      PORT: "8731"
      FOLIO_ENRICH_JOBS_DIR: /tmp/jobs
      FOLIO_ENRICH_FEEDBACK_DIR: /tmp/feedback
      FOLIO_ENRICH_EMBEDDING_DISABLED: "true"
      FOLIO_ENRICH_FOLIO_AUTO_UPDATE: "false"
      FOLIO_ENRICH_OLLAMA_AUTO_MANAGE: "false"
      FOLIO_ENRICH_ENABLED_ONTOLOGIES: '["folio"]'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8731/health')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - driver-conversion

networks:
  driver-egress:
    internal: true
  driver-conversion:
    internal: true
  proxy-outbound: {}

secrets:
  egress_proxy_password:
    file: ${MOOTLOOP_EGRESS_PROXY_PASSWORD_FILE:?dedicated proxy password file required}
  legal_egress_proxy_password:
    file: ${MOOTLOOP_LEGAL_EGRESS_PROXY_PASSWORD_FILE:?dedicated legal proxy password file required}
