name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Lint + typecheck + test
        run: make check
      - name: Check backend OpenAPI drift
        run: |
          uv run mootloop api export-openapi /tmp/mootloop-openapi.generated.json
          diff -u openapi.json /tmp/mootloop-openapi.generated.json

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Repo-hygiene invariants
        run: uv run pytest tests/invariants -v

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build driver image
        run: docker build -f Dockerfile.driver -t mootloop-driver-auth-test .
      - name: Verify Squid password-file compatibility
        run: >-
          docker run --rm --entrypoint uv
          mootloop-driver-auth-test run --no-sync python tools/security/check_squid_auth.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Check OpenAPI schema drift
        run: npm run openapi:check
      - name: Build
        run: npm run build

  public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra web
      - name: Fetch the pinned public release outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/demo-release"
          RELEASE_URL=$(python -c 'import json; print(json.load(open("config/demos/release.json"))["url"])')
          curl --fail --location --proto '=https' --tlsv1.2 "$RELEASE_URL" -o "$RUNNER_TEMP/demo-release/release.tar"
          uv run python tools/validate_demo_release.py "$RUNNER_TEMP/demo-release/release.tar" --pin config/demos/release.json --stage "$RUNNER_TEMP/demo-public"
      - name: Replay every published strategy without model calls
        run: |
          RELEASE_ID=$(python -c 'import json; print(json.load(open("config/demos/release.json"))["release_id"])')
          uv run python tools/check_demo_replays.py "$RUNNER_TEMP/demo-public/releases/$RELEASE_ID" "$RUNNER_TEMP/demo-replay-check"
      - name: Build the public reader image
        run: docker build --build-context demo_release="$RUNNER_TEMP/demo-release" -t mootloop-demo:test .
      - name: Check the image without network or writable application files
        run: |
          docker run -d --name demo-smoke --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges mootloop-demo:test
          docker exec -i demo-smoke python < tools/smoke_demo_runtime.py
      - name: Remove smoke container
        if: always()
        run: docker rm -f demo-smoke || true
