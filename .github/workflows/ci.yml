name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Lint + typecheck + test
        run: make check
      - name: Check backend OpenAPI drift
        run: |
          uv run mootloop api export-openapi /tmp/mootloop-openapi.generated.json
          diff -u openapi.json /tmp/mootloop-openapi.generated.json

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Repo-hygiene invariants
        run: uv run pytest tests/invariants -v

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build driver image
        run: docker build -f Dockerfile.driver -t mootloop-driver-auth-test .
      - name: Verify Squid password-file compatibility
        run: >-
          docker run --rm --entrypoint uv
          mootloop-driver-auth-test run --no-sync python tools/security/check_squid_auth.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Check OpenAPI schema drift
        run: npm run openapi:check
      - name: Build
        run: npm run build
